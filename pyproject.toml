[tool.pytest.ini_options]
# A bare `pytest` otherwise walks into tmp/, where a repo copy kept for
# recovery carries its own conftest and aborts collection.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Default per-test timeout (pytest-timeout is already a dev dep). A
# resolver/parser regression that drops a loop's ``pos += 1`` step
# would otherwise hang CI silently instead of failing the offending
# test; 30s is generous enough not to flake on slow CI runners.
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001 flags ambiguous Unicode whitespace; we intentionally handle NBSP /
# THIN SPACE / LINE SEPARATOR variants because Belgian publications use them
# in numeric literals (see _pdf._NUMERIC_SEPARATORS, test_pdf).
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
# Match CI's invocation (`mypy --strict custom_components/be_water_prices`)
# so local runs surface the same strict-mode complaints (recorder
# helpers not in __all__, untyped defs in third-party shims, etc.)
# instead of slipping through and breaking the workflow's Type check.
strict = true

# tests/ is deliberately outside the strict boundary. The suite leans on
# partial stubs and deliberately-wrong inputs to drive error paths, and
# type-checking it would mean either weakening those or teaching mypy
# about every mock. scripts/ is checked in CI alongside the component.
[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "pdfplumber",
    "pdfplumber.*",
    "bs4",
    "bs4.*",
    "homeassistant",
    "homeassistant.*",
    "voluptuous",
]
ignore_missing_imports = true
