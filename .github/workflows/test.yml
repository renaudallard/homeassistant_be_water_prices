name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what Home Assistant ships, so it is the version that
        # decides whether a release works. 3.14 is here because that is
        # what a current Debian / Raspberry Pi OS gives a local checkout,
        # and without it a 3.14-only failure shows up as a green local run
        # and a red CI one (or worse, the reverse).
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The pinned homeassistant version is also the floor hacs.json
      # declares. Moving one without the other leaves the integration
      # claiming support for releases nothing ever runs it on.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-timeout pdfplumber beautifulsoup4 homeassistant==2026.2.3 pytest-homeassistant-custom-component==0.13.316
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: |
          mypy --strict custom_components/be_water_prices
          mypy --strict scripts
      - name: Tests
        run: pytest tests/ -q
