name: Fixture drift check

on:
  schedule:
    # 06:30 UTC Sunday, after the daily live_check's 06:11 slot.
    # Tariffs are annual; weekly is plenty for catching mid-year revisions.
    - cron: "30 6 * * 0"
  workflow_dispatch:

# Read only, unless a job says otherwise: only the job that files the
# issue writes one.
permissions:
  contents: read

jobs:
  check:
    # Runs the extractors, the PDF reader among them, on whatever the
    # utilities serve, so it holds no token that writes anything: a process
    # it leaves behind dies with its runner. Issues are filed by the job
    # below, from the report this one hands over.
    runs-on: ubuntu-latest
    # A run takes about a minute. Each fetch is held to the integration's
    # budget. A PDF render runs in a child process that is killed at its
    # own time limit, shorter than that budget, but a text or HTML parse
    # thread the script gives up on still has to end before the script
    # can. This is the backstop for one that never returns.
    timeout-minutes: 30
    outputs:
      rc: ${{ steps.check.outputs.rc }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here needs the token, the repository being public, and
          # the extractors run third-party code.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what the extractors need, at the versions the test suite
          # proved. Reading them from requirements-dev.txt keeps this off a
          # second copy of the same numbers, without pulling the test harness
          # into a job that has no use for it.
          pip install -c requirements-dev.txt pdfplumber aiohttp beautifulsoup4

      - name: Check out the archive branch's texts
        # A PDF the card archive walked earlier today and still holds is
        # not rendered again: the check downloads it and parses it, and
        # takes the render from the branch. A fork's pull request has no
        # such branch and renders everything, as before.
        run: |
          if git fetch --depth=1 origin archive 2>/dev/null; then
            git worktree add --detach tmp/archive FETCH_HEAD
          else
            echo "no archive branch to read texts from; every PDF is rendered"
          fi

      - name: Run fixture drift check
        id: check
        run: |
          set +e
          texts=''
          [ -d tmp/archive ] && texts='--texts tmp/archive'
          python scripts/fixture_drift.py $texts > report.md
          rc=$?
          if [ ! -s report.md ]; then
            # No report at all: the script crashed before writing one,
            # and the issue it opened carried an empty body. Say so.
            {
              echo "scripts/fixture_drift.py exited $rc without writing a report: it crashed."
              echo "The traceback is in the run log."
            } > report.md
            rc=1
          fi
          cat report.md
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Exit 0 here so the issue-management step always runs.
          exit 0

      - name: Hand the report over
        if: steps.check.outputs.rc == '1'
        uses: actions/upload-artifact@v7
        with:
          name: fixture-drift-report
          path: report.md
          if-no-files-found: error
          retention-days: 3

      # rc 2 means nothing drifted but a utility was unreachable on a blip,
      # so this run did not actually check everything: neither file an issue
      # nor tell the maintainer an open one is safe to close. It still has
      # to be visible: a host that is permanently 5xx or rate-limited
      # lands here every week and would otherwise leave no trace at all.
      - name: Record the incomplete run
        if: steps.check.outputs.rc == '2'
        run: |
          {
            echo "## Incomplete run"
            echo
            echo "A utility was unreachable, so this run did not drift-check"
            echo "everything. No issue is filed and no open one is cleared."
            echo
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"

  file:
    # Holds github.token, which writes issues, and runs only the issue
    # script and gh, on the report the check handed over.
    needs: check
    if: needs.check.outputs.rc == '1' || needs.check.outputs.rc == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A folder of its own, so nothing handed over lands on the script
      # that files the issue.
      - uses: actions/download-artifact@v8
        if: needs.check.outputs.rc == '1'
        with:
          name: fixture-drift-report
          path: tmp/report

      - name: Open or update fixture-drift issue
        if: needs.check.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title_prefix='[fixture-drift] water fixtures need refresh'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Run"
            echo
            echo "$run_url"
            echo
            echo "## Latest report"
            echo
            cat tmp/report/report.md
          } > issue_body.md
          # One issue per problem, found by its label; the drifted fields
          # and the errors are the fingerprint, so a drift that stays as it
          # is gets one comment a week rather than one a day, and a new
          # drift is posted at once.
          grep -E '^\| |^- \*\*' tmp/report/report.md > drifted.txt || true
          bash scripts/file_ci_issue.sh \
            --label fixture-drift \
            --title "$title_prefix" \
            --body issue_body.md \
            --fingerprint drifted.txt \
            --workflow .github/workflows/fixture_drift.yml

      - name: Note drift cleared on existing issue
        if: needs.check.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Add a "drift cleared" comment to any open drift issue so
          # the maintainer sees that the situation resolved itself,
          # but never close the issue automatically. The issue is the one
          # under the label, the same one the filer comments on.
          existing=$(gh issue list \
            --state open \
            --label fixture-drift \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --body "Drift cleared on $(date -u +%Y-%m-%d). Safe to close."
          fi
