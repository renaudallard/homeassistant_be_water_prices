name: Archive tariff cards

on:
  schedule:
    # 05:23 UTC = 06:23 CET / 07:23 CEST, before the 06:11 live check. Off
    # the hour, since the top of the hour is where GitHub sheds scheduled
    # runs first.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      communes:
        description: Walk every commune of the per-commune utilities, not only the default rows.
        default: true
        required: false
        type: boolean
      reparse:
        description: Replay every stored month through the parser even if it did not change.
        default: false
        required: false
        type: boolean
      rerender:
        description: Replay every stored month with its PDFs rendered afresh, as a PDF reader or render code change does by itself.
        default: false
        required: false
        type: boolean

# Read only, unless a job says otherwise: the push job writes the archive
# branch, and the jobs that file issues write those.
permissions:
  contents: read

# A manual run overlapping the schedule would push the same day's cards
# twice and the second push would be rejected as non-fast-forward. Queue
# it instead of cancelling: both runs are worth finishing.
concurrency:
  group: archive-cards
  cancel-in-progress: false

# Seven jobs, as the electricity archive runs, so no token shares a runner
# with third-party code. The walk and the index run the integration, and
# the walk the PDF reader and Tesseract on whatever the utilities serve,
# which could leave a process, a git hook, a git config entry or a
# GITHUB_ENV line behind for any later step on their runner; neither is
# given a token. keep, push and token hold one and run only gh, git, jq and
# the issue script, on what the others hand over as artifacts: plain files,
# never a .git entry. ocr and report file issues with github.token alone.
jobs:
  walk:
    runs-on: ubuntu-latest
    # A full walk is sixteen utilities and about a thousand commune pages;
    # a parse that never returns is bounded per card by the script. A
    # re-render renders every kept PDF again on top.
    timeout-minutes: ${{ github.event.inputs.rerender == 'true' && 180 || 60 }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The repository is public, so nothing here needs the token, and
          # this job runs third-party code.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # What the extractors need, at the versions the test suite
          # proved, plus freezegun, which pins the clock to a row's capture
          # day while a stored month is replayed through the current parser.
          pip install -c requirements-dev.txt pdfplumber aiohttp beautifulsoup4 freezegun
          # Tesseract and its French data read AIEC's card, which is only
          # ever a picture. Installed here alone: no installation decodes a
          # picture, it reads the text this run stores.
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-fra

      - name: Check out the archive branch
        # The archive lives on its own branch so three years of daily
        # commits stay out of main's history and out of every HACS
        # download. Checked out as a worktree under tmp/, which main's
        # .gitignore covers. The first run creates the branch unborn.
        run: |
          if git fetch --depth=1 origin archive; then
            git worktree add --detach tmp/archive FETCH_HEAD
            git -C tmp/archive checkout -B archive
          else
            git worktree add --orphan -b archive tmp/archive
          fi

      - name: Store today's cards
        id: store
        # The tariffs are annual and the commune rows are most of the walk
        # (about a thousand pages), so the schedule walks them on Sundays
        # only and stores the sixteen default rows on the other days; a
        # manual run walks them unless told otherwise. The dispatch inputs
        # reach the shell through the environment, not pasted into it.
        env:
          CARDS_REPO: renaudallard/be_price_cards
          EVENT: ${{ github.event_name }}
          COMMUNES: ${{ github.event.inputs.communes }}
          REPARSE: ${{ github.event.inputs.reparse == 'true' && '--reparse' || '' }}
          RERENDER: ${{ github.event.inputs.rerender == 'true' && '--rerender' || '' }}
          ARCHIVE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/archive
        run: |
          communes=''
          if [ "$EVENT" = schedule ]; then
            [ "$(date -u +%u)" = 7 ] || communes='--defaults-only'
          elif [ "$COMMUNES" = false ]; then
            communes='--defaults-only'
          fi
          python scripts/archive_cards.py --out tmp/archive --pdfs tmp/pdfs \
            --ocr-failures tmp/ocr_failures.txt \
            --pdf-base-url "https://github.com/${CARDS_REPO}/releases/download" \
            --archive-base-url "$ARCHIVE_URL" \
            $communes $REPARSE $RERENDER

      - name: Hand the walk over
        # The rows, texts, sheets and manifest the walk wrote, the cards it
        # fetched and the pictures it could not read. The card folder always
        # holds a file, so a day with no new card still hands one over.
        run: |
          mkdir -p tmp/pdfs
          echo "Cards fetched by this run, by month" > tmp/pdfs/README
          touch tmp/ocr_failures.txt

      - uses: actions/upload-artifact@v7
        with:
          name: walk-archive
          # The worktree's .git file stays behind with every other hidden one.
          path: tmp/archive
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: walk-pdfs
          path: tmp/pdfs
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: walk-ocr
          path: tmp/ocr_failures.txt
          if-no-files-found: error
          retention-days: 3

  ocr:
    # Files the card pictures the walk read and the check refused. A
    # picture refused leaves installations on the aggregator until a person
    # transcribes it, and a reading that disagrees with a transcription
    # means one of the two is wrong, so a person has to look.
    needs: walk
    if: ${{ !cancelled() && needs.walk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: walk-ocr
          path: tmp/ocr

      - name: File the card pictures that were not read
        # Once per set of pictures: the same refusals again within the week
        # add nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s tmp/ocr/ocr_failures.txt ] || exit 0
          {
            echo "## Card pictures not read"
            echo
            sed 's/^/- /' tmp/ocr/ocr_failures.txt
            echo
            echo "Until a reading checks out, installations price on the aggregator. Read the"
            echo "picture and add its figures to \`_TRANSCRIBED\` in \`providers/aiec.py\`."
          } > ocr_body.md
          bash scripts/file_ci_issue.sh \
            --label archive-cards-ocr \
            --title "[archive-cards] a card picture was not read" \
            --body ocr_body.md \
            --fingerprint tmp/ocr/ocr_failures.txt \
            --workflow .github/workflows/archive_cards.yml

  keep:
    # Holds the cards token and runs no code of this repository or its
    # dependencies: gh, git and jq on the walk's files.
    needs: walk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: walk-archive
          path: tmp/archive

      - uses: actions/download-artifact@v8
        with:
          name: walk-pdfs
          path: tmp/pdfs

      - name: Keep the cards themselves
        id: keep
        # The PDFs and card pictures go to the releases of be_price_cards, a
        # repository shared with the electricity and gas integrations: this
        # integration's releases are named water-<YYYY-MM> after the month
        # the cards were seen in, the files by their SHA-256. Few water
        # utilities publish a PDF or a picture, so a month holds a handful of
        # files, but a card is a card and it belongs with the others rather
        # than on a git branch. GitHub caps a release at a thousand assets;
        # should a month ever overflow it spills into water-YYYY-MM-2, and
        # the manifest on the branch says which release holds each file.
        # Needs a fine-grained token with contents read and write on that
        # repository in the BE_WATER_CARDS secret; without it the step says
        # so and the branch still gets the parsed cards and their texts.
        env:
          GH_TOKEN: ${{ secrets.BE_WATER_CARDS }}
          CARDS_REPO: renaudallard/be_price_cards
        run: |
          manifest=tmp/archive/pdfs.json
          [ -s "$manifest" ] || echo '{}' > "$manifest"
          if [ -z "$GH_TOKEN" ]; then
            echo "BE_WATER_CARDS is not set: today's cards are not kept" >&2
            exit 0
          fi
          # A release needs a commit to tag, and a repository created empty
          # has none: give it a first one, once. The repository is public,
          # so asking needs no token, and the push takes it from gh's
          # credential helper, which reads GH_TOKEN: it is on no command
          # line and in no file.
          cards_url="https://github.com/${CARDS_REPO}.git"
          if [ -z "$(git ls-remote --heads "$cards_url" 2>/dev/null)" ]; then
            seed=$(mktemp -d)
            printf '%s\n' \
              "# Price cards" \
              "" \
              "The original tariff cards the Belgian price integrations refer to, kept as" \
              "release assets named by their SHA-256, one namespace per integration." \
              "Nothing here is edited by hand." \
              > "$seed/README.md"
            git -C "$seed" init -q -b main
            git -C "$seed" add README.md
            git -C "$seed" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Start the card store"
            git -C "$seed" -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push -q "$cards_url" main
          fi
          ensure_release() {
            gh release view "$1" --repo "$CARDS_REPO" >/dev/null 2>&1 && return 0
            gh release create "$1" --repo "$CARDS_REPO" --title "Water cards $2" --notes "The tariff cards, PDFs and pictures, seen in $2 that the archive branch of homeassistant_be_water_prices refers to, each named by its SHA-256. Which card each file is: search this repository for the file name; the sheets under https://github.com/${CARDS_REPO}/tree/main/water/coverage link every utility, commune and month to its card and to what was parsed out of it."
          }
          for dir in tmp/pdfs/water-*/; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")
            # The walk names a month's folder and its cards; anything else
            # in the hand-over is not one of them and is not uploaded.
            if [[ ! "$base" =~ ^water-[0-9]{4}-[0-9]{2}$ ]]; then
              echo "skipping $base: not a month of cards" >&2
              continue
            fi
            month=${base#water-}
            # Every release of this month that exists (normally one; a
            # month never nears the cap): which file is where, and how full
            # the last one is.
            : > have.txt
            n=1; tag=$base; count=0
            while gh release view "$tag" --repo "$CARDS_REPO" --json assets --jq ".assets[].name | \"\(.) $tag\"" >> have.txt 2>/dev/null; do
              count=$(gh release view "$tag" --repo "$CARDS_REPO" --json assets --jq '.assets | length')
              next="$base-$((n + 1))"
              gh release view "$next" --repo "$CARDS_REPO" >/dev/null 2>&1 || break
              n=$((n + 1)); tag=$next
            done
            ensure_release "$tag" "$month"
            # Where each file landed, merged into the manifest once per
            # month rather than once per file.
            : > landed.txt
            for card in "$dir"*; do
              [ -f "$card" ] || continue
              name=$(basename "$card")
              if [[ ! "$name" =~ ^[0-9a-f]{64}\.(pdf|jpg|png)$ ]]; then
                echo "skipping $name: not a card the walk names" >&2
                continue
              fi
              where=$(awk -v f="$name" '$1 == f {print $2; exit}' have.txt)
              if [ -z "$where" ]; then
                if [ "$count" -ge 1000 ]; then
                  n=$((n + 1)); tag="$base-$n"; count=0
                  ensure_release "$tag" "$month"
                fi
                gh release upload "$tag" "$card" --repo "$CARDS_REPO"
                count=$((count + 1))
                where=$tag
              fi
              echo "${name%.*} $where/$name" >> landed.txt
            done
            if [ -s landed.txt ]; then
              jq -Rn '[inputs | split(" ") | {(.[0]): .[1]}] | add // {}' landed.txt > landed.json
              jq -s '.[0] + .[1]' "$manifest" landed.json > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
            fi
          done
          # A month more than thirty-six back goes, unless the manifest still
          # points into it: a card is uploaded once, under the month it was
          # first seen, and every later month on the branch names that copy,
          # so the release lives as long as a row that read the card. The tag
          # is matched whole, so water-YYYY-MM does not cover water-YYYY-MM-2.
          # Only this integration's releases, not the electricity or gas ones,
          # and counted from the 1st so no day of the month shifts the cutoff.
          # Listed with an explicit limit: gh stops at 30 by default, and the
          # three namespaces keep over a hundred releases between them, so the
          # oldest water ones would sit beyond it, never listed and never
          # deleted.
          cutoff="water-$(date -u -d "$(date -u +%Y-%m-01) -36 months" +%Y-%m)"
          gh release list --repo "$CARDS_REPO" --limit 1000 --json tagName --jq '.[].tagName' \
            | while read -r tag; do
              case "$tag" in water-*) ;; *) continue ;; esac
              [ "$tag" \< "$cutoff" ] || continue
              named=$(jq --arg p "$tag/" 'any(.[]; startswith($p))' "$manifest")
              if [ "$named" = false ]; then
                gh release delete "$tag" --repo "$CARDS_REPO" --yes --cleanup-tag
              fi
            done

      - name: Hand the manifest over
        # Whatever the uploads did, so the files that landed before one
        # failed still reach the index and the push.
        if: ${{ !cancelled() && steps.keep.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: kept-manifest
          path: tmp/archive/pdfs.json
          if-no-files-found: error
          retention-days: 3

  index:
    # Runs this repository's code again, so no token. It runs whenever the
    # walk succeeded, even when an upload failed: the branch is what the
    # integration falls back on, and an expired upload token would
    # otherwise stop it until someone noticed. A card the manifest does not
    # name is offered again by the next run, and the sheets list it unlinked
    # until then.
    needs: [walk, keep]
    if: ${{ !cancelled() && needs.walk.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-dev.txt pdfplumber aiohttp beautifulsoup4 freezegun

      - uses: actions/download-artifact@v8
        with:
          name: walk-archive
          path: tmp/archive

      - name: Take the kept manifest
        # Missing when the keep job stopped before its uploads; the walk's
        # manifest stands then, and the next run offers the cards again.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: kept-manifest
          path: tmp/archive

      - name: Index the kept cards for people
        # The walk wrote the coverage sheets before today's uploads were
        # in the manifest; rewrite them now so every month links to a file
        # that exists. No fetch, a second or two.
        env:
          CARDS_REPO: renaudallard/be_price_cards
          ARCHIVE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/archive
        run: >-
          python scripts/archive_cards.py --out tmp/archive --index-only
          --pdf-base-url "https://github.com/${CARDS_REPO}/releases/download"
          --archive-base-url "$ARCHIVE_URL"

      - name: Write the listings
        # The sheets that name the cards live beside them, under this
        # integration's own directory of the shared repository, so a person
        # on the releases page is one click from the names. The root README
        # is the same text the electricity and gas workflows write, so none
        # of the three rewrites another's. The push job sends them.
        run: |
          mkdir -p tmp/listings/water
          printf '%s\n' \
            "# Price cards" \
            "" \
            "The tariff cards the Belgian price integrations read, kept as release assets" \
            "named by their SHA-256. One namespace per integration, whose own README says" \
            "what it keeps beside the cards:" \
            "" \
            "- \`electricity/\`: homeassistant_be_electricity_prices, releases \`electricity-<YYYY-MM>\`." \
            "- \`gas/\`: homeassistant_be_gas_prices, releases \`gas-<YYYY-MM>\`." \
            "- \`water/\`: homeassistant_be_water_prices, releases \`water-<YYYY-MM>\`." \
            "" \
            "Nothing here is edited by hand." \
            > tmp/listings/README.md
          printf '%s\n' \
            "# Water cards" \
            "" \
            "The tariff cards homeassistant_be_water_prices parsed, kept as the assets of the" \
            "\`water-<YYYY-MM>\` releases of this repository and named by their SHA-256. Most" \
            "water utilities publish a page rather than a PDF; the text of every page as it" \
            "was read is on the archive branch, and the coverage table links to it. AIEC" \
            "publishes its card as a picture, kept here too; the text Tesseract read off it" \
            "is on the archive branch beside the row it made." \
            "" \
            "- \`coverage.md\`: the index of one sheet per utility under \`coverage/\`; each sheet" \
            "  lists per commune the months held, each linking to the PDF, the picture or the" \
            "  page it was parsed from and to the tariff as the integration parsed it." \
            "" \
            "The parsed cards themselves are the \`archive\` branch of" \
            "https://github.com/renaudallard/homeassistant_be_water_prices." \
            > tmp/listings/water/README.md
          cp tmp/archive/coverage.md tmp/listings/water/
          cp -r tmp/archive/coverage tmp/listings/water/

      - uses: actions/upload-artifact@v7
        with:
          name: indexed-archive
          path: tmp/archive
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v7
        with:
          name: listings
          path: tmp/listings
          if-no-files-found: error
          retention-days: 3

  push:
    # Holds the cards token and a github.token that writes this repository,
    # and runs no code of this repository or its dependencies: fresh clones,
    # the indexed files laid over them as plain files, git. Both tokens
    # reach git through gh's credential helper, which reads GH_TOKEN, so
    # neither is on a command line or in a file.
    needs: index
    if: ${{ !cancelled() && needs.index.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: indexed-archive
          path: tmp/indexed

      - uses: actions/download-artifact@v8
        with:
          name: listings
          path: tmp/listings

      - name: Keep to plain files
        # A .git entry in a hand-over would be a repository, or a hook, in
        # the clone it is laid over.
        run: find tmp/indexed tmp/listings -name .git -prune -exec rm -rf {} +

      - name: Publish the listings in the cards repository
        # A commit only when a sheet changed.
        env:
          GH_TOKEN: ${{ secrets.BE_WATER_CARDS }}
          CARDS_REPO: renaudallard/be_price_cards
        run: |
          [ -n "$GH_TOKEN" ] || exit 0
          # The repository is public, so the clone needs no token.
          git clone -q --depth=1 "https://github.com/${CARDS_REPO}.git" tmp/cards
          mkdir -p tmp/cards/water
          cp tmp/listings/README.md tmp/cards/README.md
          cp tmp/listings/water/README.md tmp/listings/water/coverage.md tmp/cards/water/
          rm -rf tmp/cards/water/coverage tmp/cards/water/pdfs.md
          cp -r tmp/listings/water/coverage tmp/cards/water/
          cd tmp/cards
          git add -A
          if git diff --cached --quiet; then
            echo "listings unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config credential.helper ''
          git config --add credential.helper '!gh auth git-credential'
          git commit -q -m "Water listings of $(date -u +%Y-%m-%d)"
          # The electricity and gas archives push to the same main, and the
          # concurrency group only queues runs of this repository, so their
          # daily push can land between this step's clone and its push. The
          # only path the three trees share is the root README.md, which all
          # three write with the same text, so a rejected push fetches,
          # rebases and tries again without a conflict. Should one of the
          # texts drift, -X theirs (the commit being replayed) keeps this
          # job's, which lists all three namespaces. A pull that fails, a
          # network blip or a rebase that stops, is left to the next attempt
          # rather than ending the step.
          for attempt in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            [ "$attempt" -lt 5 ] || break
            sleep $((attempt * 3))
            git pull -q --rebase -X theirs origin main \
              || git rebase --abort 2>/dev/null || true
          done
          exit 1

      - name: Commit and push what changed
        # Whatever happened to the cards repository. The branch is what the
        # integration falls back on, and an expired upload token or a
        # listings push that lost its races would otherwise stop it until
        # someone noticed.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The repository is public, so the clone needs no token. A branch
          # that is not there yet is born here, on the first run; a clone
          # that failed for any other reason leaves a push that cannot be
          # a fast-forward, and is refused.
          if ! git clone -q --depth=1 --branch archive "https://github.com/${REPO}.git" tmp/branch; then
            git init -q -b archive tmp/branch
            git -C tmp/branch remote add origin "https://github.com/${REPO}.git"
          fi
          cd tmp/branch
          # The index's tree replaces the branch's whole, so a row the walk
          # pruned goes.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../indexed/. .
          git add -A
          if git diff --cached --quiet; then
            echo "no card changed today"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Cards seen on $(date -u +%Y-%m-%d)"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push -q origin archive

  token:
    # Holds the cards token; runs gh and the issue script only.
    needs: push
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Warn before the upload token expires
        # A fine-grained token lives a year at most, and the first sign of
        # its expiry would otherwise be the failure issue on the morning
        # after. GitHub reports a fine-grained token's expiry in a response
        # header, so ask, and file an issue while there are still two weeks
        # to make a new one and update the secret. Runs even when an earlier
        # job failed: the warning is worth having either way. After the
        # push, so a failure here cannot keep the day's rows from being
        # pushed.
        env:
          CARDS_TOKEN: ${{ secrets.BE_WATER_CARDS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CARDS_TOKEN" ] || exit 0
          expires=$(GH_TOKEN=$CARDS_TOKEN gh api -i /user 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1) == "github-authentication-token-expiration" {print $2}')
          if [ -z "$expires" ]; then
            echo "the upload token reports no expiry"
            exit 0
          fi
          left=$(( ( $(date -u -d "$expires" +%s) - $(date -u +%s) ) / 86400 ))
          echo "the upload token expires on $expires ($left days left)"
          [ "$left" -le 14 ] || exit 0
          {
            echo "## The upload token expires on $expires"
            echo
            echo "$left day(s) left. Create a new fine-grained token with contents read and"
            echo "write on the cards repository and store it as the BE_WATER_CARDS secret;"
            echo "until then the cards of each day are offered again by the next run that"
            echo "has a working token."
          } > token_body.md
          echo "token expires $expires" > token_fingerprint.txt
          # Its own label: file_ci_issue.sh finds the open issue by label, so
          # sharing the failure issue's would post this warning inside an open
          # failure thread, and a failure inside this one.
          bash scripts/file_ci_issue.sh \
            --label archive-cards-token \
            --title "[archive-cards] the upload token expires soon" \
            --body token_body.md \
            --fingerprint token_fingerprint.txt \
            --workflow .github/workflows/archive_cards.yml

  report:
    needs: [walk, ocr, keep, index, push, token]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: File the failure as an issue
        # Nobody watches the Actions tab. A run that stored nothing, a push
        # that was refused or an upload token that has expired (fine-grained
        # tokens live a year at most) would otherwise end the archive quietly.
        # One open issue per problem, a comment per further failing run,
        # and it says which job failed so the token case is told from the
        # others.
        env:
          GH_TOKEN: ${{ github.token }}
          WALK: ${{ needs.walk.result }}
          KEEP: ${{ needs.keep.result }}
          INDEX: ${{ needs.index.result }}
          PUSH: ${{ needs.push.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label='archive-cards'
          failed=''
          [ "$WALK" = 'failure' ] && failed='Store today'"'"'s cards (the walk stored nothing, or crashed)'
          [ "$KEEP" = 'failure' ] && failed='Keep the cards themselves (the upload to the cards repository; check the BE_WATER_CARDS token, it expires)'
          [ "$INDEX" = 'failure' ] && failed='Index the kept cards for people (the coverage sheets written after the upload)'
          [ "$PUSH" = 'failure' ] && failed='Commit and push what changed (the archive branch, or the listings in the cards repository)'
          {
            echo "## Run"
            echo
            echo "$RUN_URL"
            echo
            echo "## Failed job"
            echo
            echo "${failed:-an earlier job; see the run}"
          } > issue_body.md
          # The failed job is the fingerprint: the same job failing again
          # within the week adds nothing, a different one is posted at once.
          echo "${failed:-unknown}" > failed_step.txt
          bash scripts/file_ci_issue.sh \
            --label "$label" \
            --title "[archive-cards] the card archive run failed" \
            --body issue_body.md \
            --fingerprint failed_step.txt \
            --workflow .github/workflows/archive_cards.yml
