name: Live extractor check

on:
  schedule:
    # 06:11 UTC = 07:11 CET / 08:11 CEST, after the card archive (05:23),
    # whose texts this reads. Water tariffs are annual so the daily run is
    # mostly a "did the page change shape" canary. Off the hour on purpose:
    # GitHub documents the start of every hour as a high-load slot for the
    # schedule event and drops queued runs out of it when the load is bad
    # enough, which took the electricity integration's 06:00 runs on
    # 2026-08-27 with no run created at all.
    - cron: "11 6 * * *"
  workflow_dispatch:

# Read only, unless a job says otherwise: only the job that files the
# issue writes one.
permissions:
  contents: read

# A run still going when the next is triggered would otherwise file the
# same issue twice. The newer run wins.
concurrency:
  group: live-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Runs the extractors, the PDF reader among them, on whatever the
    # utilities serve, so it holds no token that writes anything: a process
    # it leaves behind dies with its runner. The issue is filed by the job
    # below, from the report this one hands over.
    runs-on: ubuntu-latest
    # A run takes minutes. Each fetch is held to the integration's budget.
    # A PDF render runs in a child process that is killed at its own time
    # limit, shorter than that budget, but a text or HTML parse thread the
    # script gives up on still has to end before the script can. This is
    # the backstop for one that never returns, and leaves room for five
    # attempts and their backoff.
    timeout-minutes: 60
    outputs:
      real_fail: ${{ steps.check.outputs.real_fail }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here needs the token, the repository being public, and
          # the extractors run third-party code.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what the extractors need, at the versions the test suite
          # proved. Reading them from requirements-dev.txt keeps this off a
          # second copy of the same numbers, without pulling the test harness
          # into a job that has no use for it.
          pip install -c requirements-dev.txt pdfplumber aiohttp beautifulsoup4

      - name: Resolve names through nsec.arnor.org over TLS
        # As the electricity and gas live checks do. Fluvius serves its zone
        # from two nameservers that never answer a GitHub runner, whichever
        # resolver it asks, and a utility whose nameservers did the same
        # would read here as a dead host. The runner's resolver still finds
        # nsec.arnor.org, and systemd-resolved then asks it over
        # DNS-over-TLS, checking its certificate. If that cannot resolve a
        # name, the runner's resolver is put back so every operator is still
        # checked.
        run: |
          iface=$(ip -o route show default | awk '{print $5; exit}')
          servers=$(getent ahostsv4 nsec.arnor.org | awk '{print $1}' | sort -u |
            sed 's/$/#nsec.arnor.org/')
          if [ -z "$servers" ]; then
            echo "nsec.arnor.org did not resolve; keeping the runner's resolver"
            exit 0
          fi
          # Kept to put back: "resolvectl revert" would also drop the
          # servers DHCP gave the link and leave the runner with none.
          runner=$(resolvectl dns "$iface" | cut -d: -f2-)
          sudo resolvectl dns "$iface" $servers
          sudo resolvectl dnsovertls "$iface" yes
          sudo resolvectl flush-caches
          if getent hosts www.farys.be && getent hosts www.swde.be; then
            resolvectl status "$iface"
          else
            echo "nsec.arnor.org resolved nothing; back to$runner"
            sudo resolvectl dnsovertls "$iface" no
            sudo resolvectl dns "$iface" $runner
            sudo resolvectl flush-caches
          fi

      - name: Check out the archive branch's texts
        # A PDF the card archive walked earlier today and still holds is
        # not rendered again: the check downloads it and parses it, and
        # takes the render from the branch. A fork's pull request has no
        # such branch and renders everything, as before.
        run: |
          if git fetch --depth=1 origin archive 2>/dev/null; then
            git worktree add --detach tmp/archive FETCH_HEAD
          else
            echo "no archive branch to read texts from; every PDF is rendered"
          fi

      - name: Run live check (up to 5 attempts on extractor failure)
        id: check
        run: |
          set +e
          texts=''
          [ -d tmp/archive ] && texts='--texts tmp/archive'
          attempts=5
          delays="10 30 60 120"
          set -- $delays
          # Latch the bits across attempts. Reading only the last attempt
          # meant four rounds of a genuinely broken extractor followed by
          # one round where it merely timed out reported "no regressions"
          # and opened nothing. A round that comes back fully green still
          # clears the run, so a failure that actually recovers on retry
          # stays quiet.
          worst=0
          green=0
          for i in $(seq 1 "$attempts"); do
            echo "::group::attempt $i"
            python scripts/live_check.py $texts > report.md
            rc=$?
            if [ ! -s report.md ]; then
              # No report at all: the script crashed before writing one.
              # Retrying a crash gets the same crash, and the issue it
              # opened carried an empty body. Say so and stop, under the
              # report of an earlier attempt that named the extractor.
              {
                echo "scripts/live_check.py exited $rc on attempt $i without writing a report: it crashed."
                echo "The traceback is in the run log."
              } >> fail_report.md
              echo "::endgroup::"
              worst=1
              break
            fi
            worst=$((worst | rc))
            if [ $((rc & 1)) -ne 0 ]; then
              # Keep the report that carried the real failure. A later
              # attempt that only timed out overwrites report.md, and
              # the issue then opened with a body saying nothing broke.
              cp report.md fail_report.md
            fi
            cat report.md
            echo "::endgroup::"
            # Stop once fully green. Retry on any failure, bit 1 (real)
            # or bit 2 (transient), so an upstream hiccup gets its
            # retries to recover before we judge the final state.
            if [ $((rc & 3)) -eq 0 ]; then
              green=1
              break
            fi
            if [ "$i" -lt "$attempts" ]; then
              sleep_for=$1
              shift
              echo "attempt $i failed (exit $rc), sleeping ${sleep_for}s..." >&2
              sleep "$sleep_for"
            fi
          done
          if [ "$green" -eq 1 ]; then
            worst=0
          fi
          echo "rc=$worst" >> "$GITHUB_OUTPUT"
          # Only a real failure (bit 1) opens an issue; a transient-only
          # result (bit 2) is an upstream hiccup, not a regression. The
          # bit is read off the latched value, so a real failure seen in
          # any attempt still counts even if the last one only timed out.
          if [ $((worst & 1)) -ne 0 ]; then
            echo "real_fail=1" >> "$GITHUB_OUTPUT"
          else
            echo "real_fail=0" >> "$GITHUB_OUTPUT"
          fi
          # Exit 0 here so subsequent issue-creation steps run regardless.
          exit 0

      - name: Hand the report over
        if: steps.check.outputs.real_fail == '1'
        uses: actions/upload-artifact@v7
        with:
          name: live-check-report
          path: fail_report.md
          if-no-files-found: error
          retention-days: 3

  file:
    # Holds github.token, which writes issues, and runs only the issue
    # script, on the report the check handed over.
    needs: check
    if: needs.check.outputs.real_fail == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A folder of its own, so nothing handed over lands on the script
      # that files the issue.
      - uses: actions/download-artifact@v8
        with:
          name: live-check-report
          path: tmp/report

      - name: Open or update extractor-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title_prefix='[live-check] water extractor broken'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Run"
            echo
            echo "$run_url"
            echo
            echo "## Report of the failing attempt"
            echo
            cat tmp/report/fail_report.md
          } > issue_body.md
          # One issue per problem, found by its label; the failing
          # utilities are the fingerprint, so a utility that stays broken
          # gets one comment a week rather than one a day, and a failure
          # that changes shape is posted at once.
          grep '| FAIL |' tmp/report/fail_report.md | cut -d'|' -f2 | sed 's/^ *//;s/ *$//' | sort > failed.txt
          bash scripts/file_ci_issue.sh \
            --label live-check \
            --title "$title_prefix" \
            --body issue_body.md \
            --fingerprint failed.txt \
            --workflow .github/workflows/live_check.yml
