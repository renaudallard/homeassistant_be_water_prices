name: Autorelease

on:
  push:
    branches:
      - main
    paths:
      - custom_components/be_water_prices/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A version that fails the suite must not reach HACS users.
  verify:
    uses: ./.github/workflows/test.yml

  release:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          ver=$(jq -r .version custom_components/be_water_prices/manifest.json)
          if [ -z "$ver" ] || [ "$ver" = "null" ]; then
            echo "no version in manifest.json" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check if tag and release exist
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release zip
        run: |
          mkdir -p dist
          cd custom_components/be_water_prices
          zip -qr ../../dist/be_water_prices.zip . \
            -x '*.pyc' '__pycache__/*' '*/__pycache__/*'
          cd ../..
          unzip -l dist/be_water_prices.zip

      - name: Push tag (when missing)
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"

      - name: Add the zip to a release that exists without one
        if: steps.check.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # A run that created the release and died before the upload
          # left it without its asset, and a re-run saw the release and
          # did nothing. Upload the missing asset; leave a present one.
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'be_water_prices.zip'; then
            echo "release $tag already carries be_water_prices.zip"
          else
            gh release upload "$tag" dist/be_water_prices.zip
          fi

      - name: Create release (with retry on transient API errors)
        if: steps.check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # GitHub guesses the previous release when it writes the notes,
          # and guessed wrong here twice: no start at all for v0.7.3 and
          # v0.7.2 for v0.7.4. Hand it the highest tag below this one.
          git fetch --tags --quiet origin
          # Sort every tag plus this one by version and take the line
          # before it: the highest other tag is not the same thing once a
          # fix lands on an older line.
          prev=$( { git tag --list 'v*'; echo "$tag"; } | sort -uV | awk -v t="$tag" '$0 == t {exit} {p = $0} END {print p}')
          args=(--title "$tag" --generate-notes)
          if [ -n "$prev" ]; then
            args+=(--notes-start-tag "$prev")
          fi
          set +e
          for delay in 10 30 90; do
            gh release create "$tag" "${args[@]}" dist/be_water_prices.zip && exit 0
            echo "release create failed, sleeping ${delay}s..." >&2
            sleep "$delay"
          done
          # Final attempt; surface its exit code so the run fails if it still
          # returns non-zero after the three retries.
          gh release create "$tag" "${args[@]}" dist/be_water_prices.zip
